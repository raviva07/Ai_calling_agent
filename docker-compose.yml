services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_calling_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai_calling_agent_pg:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_calling_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ai_calling_agent_pg:
